<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Score Predictor - AI Powered</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23ffffff" fill-opacity="0.1" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,122.7C672,117,768,139,864,154.7C960,171,1056,181,1152,165.3C1248,149,1344,107,1392,85.3L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') no-repeat bottom;
            background-size: cover;
            z-index: 0;
            pointer-events: none;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 700;
            color: white;
            text-shadow: 2px 2px 20px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            animation: fadeInDown 1s ease;
        }

        .hero-subtitle {
            font-size: 1.3rem;
            color: rgba(255,255,255,0.9);
            font-weight: 300;
            animation: fadeInUp 1s ease;
        }

        .cricket-icon {
            font-size: 4rem;
            color: white;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .main-container {
            position: relative;
            z-index: 1;
        }

        .card {
            border: none;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideInUp 0.8s ease;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border-radius: 20px 20px 0 0 !important;
            padding: 25px;
            border: none;
        }

        .card-header h4 {
            font-weight: 600;
            font-size: 1.5rem;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .card-body {
            padding: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #555;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .form-control, .form-select {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            transform: scale(1.02);
        }

        .table {
            margin-bottom: 0;
        }

        .table td {
            padding: 15px 10px;
            vertical-align: middle;
            border: none;
        }

        .btn-predict {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            padding: 14px 30px;
            font-weight: 600;
            font-size: 1.1rem;
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-predict::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-predict:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-predict:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
        }

        .btn-predict:active {
            transform: translateY(-1px);
        }

        .result-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .result-table {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .result-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .result-table thead th {
            padding: 15px;
            font-weight: 600;
            border: none;
        }

        .result-table tbody td {
            padding: 18px 15px;
            font-weight: 500;
            border-bottom: 1px solid #f0f0f0;
        }

        .result-table tbody tr:last-child td {
            border-bottom: none;
        }

        .result-table tbody tr:hover {
            background: rgba(102, 126, 234, 0.05);
            transition: all 0.3s ease;
        }

        .score-display {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        .icon-badge {
            background: rgba(255,255,255,0.3);
            padding: 8px 12px;
            border-radius: 10px;
            display: inline-block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid rgba(102, 126, 234, 0.1);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 2rem;
            }
            
            .hero-subtitle {
                font-size: 1rem;
            }

            .card {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid mt-5 px-4">
        <div class="row">
            <!-- Form Column (col-md-6) -->
            <div class="col-md-6">
                <div class="card shadow-lg h-100">
                    <div class="card-header bg-success text-white">
                        <h4 class="text-center">Predict Final Cricket Score</h4>
                    </div>
                    <div class="card-body">
                        <form id="prediction-form" class="needs-validation" novalidate>
                            <table class="table">
                                <tr>
                                    <td><label for="batting_team" class="form-label">Bat Team:</label></td>
                                    <td>
                                        <select class="form-control" id="batting_team" name="batting_team">
                                            {% for team in mainteams %}
                                              <option value="{{ team }}">{{ team }}</option>
                                            {% endfor %}
                                        </select>
                                    </td>
                                </tr>
                                <tr>
                                    <td><label for="bowling_team" class="form-label">Bowl Team:</label></td>
                                    <td>
                                        <select class="form-control" id="bowling_team" name="bowling_team">
                                            {% for team in mainteams %}
                                              <option value="{{ team }}">{{ team }}</option>
                                            {% endfor %}
                                        </select>
                                    </td>
                                </tr>
                                <tr>
                                    <td><label for="format_type" class="form-label">Format:</label></td>
                                    <td>
                                        <select class="form-control" id="format_type" name="format_type">
                                            {% for format in formats %}
                                              <option value="{{ format }}">{{ format }}</option>
                                            {% endfor %}
                                        </select>                                        
                                    </td>
                                </tr>
                                <tr>
                                    <td><label for="over" class="form-label">Over:</label></td>
                                    <td>
                                        <input type="number" class="form-control" id="over" name="over" min="1" max="10" required>
                                        <div class="invalid-feedback">Please enter a valid over number (1-10).</div>
                                    </td>
                                </tr>
                                <tr>
                                    <td><label for="score" class="form-label">Score:</label></td>
                                    <td>
                                        <input type="number" class="form-control" id="score" name="score" placeholder="Enter score at the over" required>
                                        <div class="invalid-feedback">Please enter the score.</div>
                                    </td>
                                </tr>
                                <tr>
                                    <td><label for="wickets" class="form-label">Wickets:</label></td>
                                    <td>
                                        <input type="number" class="form-control" id="wickets" name="wickets" placeholder="Enter wickets fallen" required>
                                        <div class="invalid-feedback">Please enter the number of wickets.</div>
                                    </td>
                                </tr>
                                <tr>
                                    <td colspan="2">
                                        <button type="submit" class="btn btn-success w-100">Predict</button>
                                    </td>
                                </tr>
                            </table>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Prediction Result Column (col-md-6) -->
            <div class="col-md-6">
                <div class="card shadow-lg h-100">
                    <div class="card-header bg-success text-white">
                        <h4 class="text-center">Prediction Results</h4>
                    </div>
                    <div class="card-body">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>Scenario</th>
                                    <th>Predicted Score</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Based on Batting Team</td>
                                    <td id="batting-team-score" class="text-center text-primary"></td>
                                </tr>
                                <tr>
                                    <td>Based on Bowling Team</td>
                                    <td id="bowling-team-score" class="text-center text-primary"></td>
                                </tr>
                                <tr>
                                    <td>Based on Both Teams</td>
                                    <td id="both-teams-score" class="text-center text-primary"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.getElementById('prediction-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const response = await fetch('/predict', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            // Update the table with the predicted scores
            document.getElementById('batting-team-score').innerText = data.predicted_score_batting;
            document.getElementById('bowling-team-score').innerText = data.predicted_score_bowling;
            document.getElementById('both-teams-score').innerText = data.predicted_score_both;
        });
    </script>
</body>
</html>
